<rect x="0.5" y="0.5" width="1199" height="399" rx="18" fill="#090B0A" stroke="#2A302C"/>
<text x="40" y="52" font-size="22" fill="#F2F5F3" font-weight="600" text-anchor="start" >Why augmenting paths beat greedy</text>
<text x="40" y="78" font-size="15" fill="#8B9690" font-weight="400" text-anchor="start" >R1 can use C1 or C2.  R2 can only use C1.  Same graph, two strategies.</text>
<rect x="40" y="100" width="540" height="260" rx="14" fill="#171B19" stroke="#2A302C"/>
<rect x="60" y="122" width="10" height="10" rx="2" fill="#D95926"/><text x="78" y="132" font-size="14" fill="#F2F5F3" font-weight="600" text-anchor="start" >Greedy first-available</text>
<line x1="180" y1="190" x2="440" y2="190" stroke="#3A423D" stroke-width="1.5"/>
<line x1="180" y1="190" x2="440" y2="290" stroke="#3A423D" stroke-width="1.5"/>
