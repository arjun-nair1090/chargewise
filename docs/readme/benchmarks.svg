<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="JMH speed-ups: segment tree up to 88.9x, Quickselect up to 4.4x">
<title>JMH speed-ups: segment tree up to 88.9x, Quickselect up to 4.4x</title>
<style>
text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, 'Cascadia Mono', SFMono-Regular, Consolas, Menlo, monospace; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.grow { animation: grow 1.3s cubic-bezier(0.22,1,0.36,1) both; transform-box: fill-box; }
@keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
.rise { animation: rise 0.6s ease-out both; }
@keyframes rise { from { opacity: 0; } to { opacity: 1; } }
</style>
<rect x="0.5" y="0.5" width="1199" height="559" rx="18" fill="#090B0A" stroke="#2A302C"/>
<text x="40" y="52" font-size="22" fill="#F2F5F3" font-weight="600" text-anchor="start" >Speed-up over the baseline</text>
<text x="40" y="78" font-size="15" fill="#8B9690" font-weight="400" text-anchor="start" >JMH average time per call, forked JVM, 99.9% confidence intervals. Log scale; the 1× line is parity.</text>
<line x1="360.0" y1="110" x2="360.0" y2="454" stroke="#2A302C" stroke-width="1"/>
<text x="360.0" y="476" font-size="12" fill="#8B9690" font-weight="400" text-anchor="middle" class="mono" >0.5×</text>
