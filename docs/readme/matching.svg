<line class="m6" x1="760" y1="290" x2="1020" y2="190" stroke="#B8F34A" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
<line class="m7" x1="760" y1="190" x2="1020" y2="190" stroke="#B8F34A" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
<line class="m8" x1="760" y1="190" x2="1020" y2="290" stroke="#B8F34A" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
<g class="m9"><text x="890" y="345" font-size="14" fill="#B8F34A" font-weight="600" text-anchor="middle" class="mono" >augmenting path  R2 → C1 → R1 → C2</text></g>
<line class="m10" x1="760" y1="190" x2="1020" y2="290" stroke="#3987E5" stroke-width="4" stroke-linecap="round"/>
<line class="m11" x1="760" y1="290" x2="1020" y2="190" stroke="#3987E5" stroke-width="4" stroke-linecap="round"/>
<g class="m12"><text x="890" y="345" font-size="15" fill="#F2F5F3" font-weight="600" text-anchor="middle" >2 of 2 requests served</text></g>
<circle cx="760" cy="190" r="20" fill="#1F2421" stroke="#F2F5F3" stroke-width="2"/><text x="760" y="195" font-size="13" fill="#F2F5F3" font-weight="600" text-anchor="middle" class="mono" >R1</text>
<circle cx="760" cy="290" r="20" fill="#1F2421" stroke="#F2F5F3" stroke-width="2"/><text x="760" y="295" font-size="13" fill="#F2F5F3" font-weight="600" text-anchor="middle" class="mono" >R2</text>
<rect x="1000" y="170" width="40" height="40" rx="9" fill="#1F2421" stroke="#F2F5F3" stroke-width="2"/><text x="1020" y="195" font-size="13" fill="#F2F5F3" font-weight="600" text-anchor="middle" class="mono" >C1</text>
<rect x="1000" y="270" width="40" height="40" rx="9" fill="#1F2421" stroke="#F2F5F3" stroke-width="2"/><text x="1020" y="295" font-size="13" fill="#F2F5F3" font-weight="600" text-anchor="middle" class="mono" >C2</text>

