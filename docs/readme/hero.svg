<title>ChargeWise: EV charging allocation decided by algorithms written from scratch</title>
<style>
text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, 'Cascadia Mono', SFMono-Regular, Consolas, Menlo, monospace; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.rise { animation: rise 0.9s cubic-bezier(0.22,1,0.36,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.draw { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 0.9s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.pop { animation: pop 0.5s cubic-bezier(0.22,1,0.36,1) both; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }
.flow { stroke-dasharray: 3 9; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -12; } }
.ring { animation: ring 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ring { 0% { opacity: 0.7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
.blink { animation: blink 1.2s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
</style>
