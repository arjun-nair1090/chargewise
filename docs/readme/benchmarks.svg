<text x="1110.0" y="476" font-size="12" fill="#8B9690" font-weight="400" text-anchor="middle" class="mono" >200×</text>
<line x1="446.8" y1="106" x2="446.8" y2="454" stroke="#8B9690" stroke-width="1.5"/>
<text x="40" y="134" font-size="14" fill="#F2F5F3" font-weight="600" text-anchor="start" >Segment tree vs naive scan, 1,000 operations</text>
<text x="342" y="170" font-size="13" fill="#8B9690" font-weight="400" text-anchor="end" class="mono" >n = 1,000</text>
