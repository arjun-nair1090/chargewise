<g class="m3"><text x="154" y="295" font-size="13" fill="#FF6B5E" font-weight="600" text-anchor="end" class="mono" >unmatched</text></g>
<g class="m4"><text x="310" y="345" font-size="15" fill="#F2F5F3" font-weight="600" text-anchor="middle" >1 of 2 requests served</text></g>
<circle cx="180" cy="190" r="20" fill="#1F2421" stroke="#F2F5F3" stroke-width="2"/><text x="180" y="195" font-size="13" fill="#F2F5F3" font-weight="600" text-anchor="middle" class="mono" >R1</text>
<circle cx="180" cy="290" r="20" fill="#1F2421" stroke="#F2F5F3" stroke-width="2"/><text x="180" y="295" font-size="13" fill="#F2F5F3" font-weight="600" text-anchor="middle" class="mono" >R2</text>
<rect x="420" y="170" width="40" height="40" rx="9" fill="#1F2421" stroke="#F2F5F3" stroke-width="2"/><text x="440" y="195" font-size="13" fill="#F2F5F3" font-weight="600" text-anchor="middle" class="mono" >C1</text>
<rect x="420" y="270" width="40" height="40" rx="9" fill="#1F2421" stroke="#F2F5F3" stroke-width="2"/><text x="440" y="295" font-size="13" fill="#F2F5F3" font-weight="600" text-anchor="middle" class="mono" >C2</text>

<rect x="620" y="100" width="540" height="260" rx="14" fill="#171B19" stroke="#2A302C"/>
<rect x="640" y="122" width="10" height="10" rx="2" fill="#3987E5"/><text x="658" y="132" font-size="14" fill="#F2F5F3" font-weight="600" text-anchor="start" >Bipartite matching (DFS augmenting paths)</text>
<line x1="760" y1="190" x2="1020" y2="190" stroke="#3A423D" stroke-width="1.5"/>
<line x1="760" y1="190" x2="1020" y2="290" stroke="#3A423D" stroke-width="1.5"/>
