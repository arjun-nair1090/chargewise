<text x="342" y="376" font-size="13" fill="#8B9690" font-weight="400" text-anchor="end" class="mono" >n = 10,000</text>
<rect class="grow" style="animation-delay:0.68s; transform-origin:left" x="446.8" y="362" width="104.3" height="22" rx="4" fill="#3987E5"/>
<g class="rise" style="animation-delay:1.38s"><text x="561.0287908110456" y="378" font-size="13" fill="#F2F5F3" font-weight="600" text-anchor="start" class="mono" >2.3× faster</text></g>
<text x="342" y="420" font-size="13" fill="#8B9690" font-weight="400" text-anchor="end" class="mono" >n = 100,000</text>
<rect class="grow" style="animation-delay:0.80s; transform-origin:left" x="446.8" y="406" width="185.5" height="22" rx="4" fill="#3987E5"/>
<g class="rise" style="animation-delay:1.50s"><text x="642.2312346653905" y="422" font-size="13" fill="#F2F5F3" font-weight="600" text-anchor="start" class="mono" >4.4× faster</text></g>
<rect x="40" y="493" width="12" height="12" rx="2" fill="#3987E5"/><text x="60" y="504" font-size="13" fill="#8B9690" font-weight="400" text-anchor="start" >algorithm faster</text>
<rect x="200" y="493" width="12" height="12" rx="2" fill="#D95926"/><text x="220" y="504" font-size="13" fill="#8B9690" font-weight="400" text-anchor="start" >baseline faster</text>
