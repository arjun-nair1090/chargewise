<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Greedy serves 1 of 2 requests; an augmenting path serves both">
<title>Greedy serves 1 of 2 requests; an augmenting path serves both</title>
<style>
