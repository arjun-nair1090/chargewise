<text x="648.2331700650902" y="476" font-size="12" fill="#8B9690" font-weight="400" text-anchor="middle" class="mono" >5×</text>
<line x1="735.0" y1="110" x2="735.0" y2="454" stroke="#2A302C" stroke-width="1"/>
<text x="735.0" y="476" font-size="12" fill="#8B9690" font-weight="400" text-anchor="middle" class="mono" >10×</text>
<line x1="821.8" y1="110" x2="821.8" y2="454" stroke="#2A302C" stroke-width="1"/>
<text x="821.7668299349098" y="476" font-size="12" fill="#8B9690" font-weight="400" text-anchor="middle" class="mono" >20×</text>
<line x1="936.5" y1="110" x2="936.5" y2="454" stroke="#2A302C" stroke-width="1"/>
<text x="936.4663401301806" y="476" font-size="12" fill="#8B9690" font-weight="400" text-anchor="middle" class="mono" >50×</text>
<line x1="1023.2" y1="110" x2="1023.2" y2="454" stroke="#2A302C" stroke-width="1"/>
<text x="1023.2331700650902" y="476" font-size="12" fill="#8B9690" font-weight="400" text-anchor="middle" class="mono" >100×</text>
