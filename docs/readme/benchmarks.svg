<text x="40" y="296" font-size="14" fill="#F2F5F3" font-weight="600" text-anchor="start" >Quickselect vs full sort, uniform data</text>
<text x="342" y="332" font-size="13" fill="#8B9690" font-weight="400" text-anchor="end" class="mono" >n = 1,000</text>
<rect class="grow" style="animation-delay:0.56s; transform-origin:right" x="434.8" y="318" width="11.9" height="22" rx="4" fill="#D95926"/>
